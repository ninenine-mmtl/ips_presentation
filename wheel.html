<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>IPS Presentation Contest</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 10px;
    padding-bottom: 80px; 
    box-sizing: border-box;
    overflow-y: auto; 
    overflow-x: hidden;
  }
  
  .header-section { text-align: center; z-index: 10; width: 100%; margin-bottom: 10px; }
  h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 5px 0; }
  
  .controls { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; justify-content: center; z-index: 10; align-items: center; }
  
  select, .add-btn {
    padding: 10px 15px; font-size: 1.1rem; border-radius: 25px;
    border: 2px solid #00d2ff; background: rgba(255,255,255,0.1);
    color: white; outline: none; text-align: center;
  }
  select { width: clamp(140px, 30vw, 200px); cursor: pointer; }
  select option { background: #0f2027; color: white; }
  
  .add-btn { background: #2ecc71; border: none; cursor: pointer; font-weight: bold; padding: 10px 20px; }
  .add-btn:hover { background: #27ae60; }
  
  button.spin-btn {
    padding: 10px 25px; font-size: 1.1rem; font-weight: bold; color: white;
    background: #f39c12; border: none; border-radius: 25px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s;
  }
  button.spin-btn:hover { background: #f1c40f; transform: scale(1.05); }
  button.spin-btn:disabled { background: #7f8c8d; cursor: not-allowed; transform: none; }

  .contestant-name {
    font-size: clamp(2rem, 6vw, 3.5rem); color: #f1c40f;
    text-shadow: 0 0 15px rgba(241, 196, 15, 0.6), 2px 2px 5px rgba(0,0,0,0.8);
    margin: 5px 0 0 0; text-align: center; display: none; font-weight: bold; letter-spacing: 2px;
  }
  .contestant-township {
    font-size: clamp(1rem, 3vw, 1.5rem); color: #00d2ff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8); margin-bottom: 10px;
    text-align: center; display: none;
  }
  .show-anim { display: block !important; animation: popIn 0.5s ease-out; }
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .arena {
    position: relative; flex-grow: 1; width: 100%; max-width: 800px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; margin-top: 10px;
  }

  .wheel-wrapper {
    position: relative; width: clamp(250px, 55vmin, 400px); height: clamp(250px, 55vmin, 400px); z-index: 1; margin-bottom: 20px;
  }
  canvas { width: 100%; height: 100%; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
  
  .pointer {
    position: absolute; right: -5%; top: 50%; transform: translateY(-50%);
    width: 0; height: 0; border-top: clamp(10px, 3vw, 15px) solid transparent;
    border-bottom: clamp(10px, 3vw, 15px) solid transparent; border-right: clamp(20px, 6vw, 30px) solid #e74c3c;
    z-index: 5;
  }

  .topic-card {
    position: absolute; background: rgba(15, 32, 39, 0.95); border: 2px solid #00d2ff;
    border-radius: 8px; padding: 10px; width: clamp(110px, 24vw, 180px); height: clamp(50px, 12vw, 80px);
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: clamp(0.7rem, 1.8vw, 1rem); font-weight: bold; opacity: 0;
    transform: scale(0.5); transition: all 0.3s ease; z-index: 10; box-shadow: 0 5px 15px rgba(0,0,0,0.7);
  }
  .topic-card.show { opacity: 1; transform: scale(1); background: #00d2ff; color: #0f2027; }

  .pos-0 { top: -10%; left: -5%; }
  .pos-1 { top: -10%; right: -5%; }
  .pos-2 { bottom: 5%; left: -5%; }
  .pos-3 { bottom: 5%; right: -5%; }
  .pos-4 { bottom: -15%; left: 50%; transform: translateX(-50%) scale(0.5); }
  .pos-4.show { transform: translateX(-50%) scale(1); }

  .floating-menu { position: fixed; bottom: 15px; right: 15px; display: flex; flex-wrap: wrap; gap: 10px; z-index: 100; justify-content: flex-end; }
  .float-btn {
    background: rgba(0,0,0,0.8); color: white; border: 1px solid #fff; 
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
  }
  .float-btn.reset { background: rgba(231, 76, 60, 0.9); border-color: #e74c3c; }

  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center;
  }
  .modal-content {
    background: #11222c; padding: 20px; border-radius: 12px; border: 2px solid #00d2ff;
    width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto;
  }
  
  table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
  th, td { border: 1px solid #444; padding: 8px; text-align: left; }
  th { background: #00d2ff; color: #000; }
  
  textarea { width: 100%; padding: 10px; font-size: 1rem; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; background: #222; color: #fff; border: 1px solid #555; }
  label { font-weight: bold; color: #f39c12; font-size: 0.9rem; display: block; margin-top: 10px; margin-bottom: 5px; }
  
  .action-row { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-top: 15px; }
  .action-btn { flex-grow: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
  .bg-red { background: #e74c3c; color: white; }
  .bg-blue { background: #3498db; color: white; }
  .bg-green { background: #2ecc71; color: white; }
  .bg-gray { background: #95a5a6; color: white; }
</style>
</head>
<body>

<div class="header-section">
  <h1>IPS Presentation Contest</h1>
  <div class="controls">
    <select id="townshipSelect" onchange="populateStudentDropdown()">
      <option value="">-- All Townships --</option>
    </select>
    <select id="studentSelect">
      <option value="">-- Select Student --</option>
    </select>
    <button class="add-btn" onclick="addStudentOnTheSpot()">➕ New</button>
    <button class="spin-btn" id="drawBtn" onclick="startDrawSequence()">Spin Wheel</button>
  </div>
</div>

<div class="arena" id="arena">
  <div id="prominentName" class="contestant-name"></div>
  <div id="prominentTownship" class="contestant-township"></div>
  <div class="wheel-wrapper">
    <canvas id="wheelCanvas" width="500" height="500"></canvas>
    <div class="pointer"></div>
  </div>
</div>

<div class="floating-menu">
  <button class="float-btn reset" onclick="globalWipe()">🛑 Factory Reset</button>
  <button class="float-btn" onclick="openHistory()">📜 History</button>
  <button class="float-btn" onclick="requestAdmin()">⚙ Admin</button>
</div>

<!-- Admin Panel Modal -->
<div id="adminModal" class="modal">
  <div class="modal-content">
    <h3>Admin: Manage Data</h3>
    
    <label>Essay Topics (One per line):</label>
    <textarea id="topicList" rows="5" oninput="autoSaveAdmin()"></textarea>
    
    <label>Pre-added Students (Format: Township: Student Name):</label>
    <textarea id="studentList" rows="6" oninput="autoSaveAdmin()" placeholder="Pakokku: Mg 1&#10;Yangon: Mg 2"></textarea>
    
    <div class="action-row">
      <button class="action-btn bg-red" onclick="clearPool()">Clear All Data</button>
      <button class="action-btn bg-blue" onclick="reloadApp()">Save & Refresh</button>
      <button class="action-btn bg-gray" onclick="closeModals()">Close</button>
    </div>
  </div>
</div>

<!-- History Panel Modal -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <h3>Draw History</h3>
    <div style="overflow-x: auto;">
      <table id="historyTable">
        <thead><tr><th>Time</th><th>Township</th><th>Student</th><th>Topic 1</th><th>Topic 2</th><th>Topic 3</th><th>Topic 4</th><th>Topic 5</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
    <div class="action-row">
      <button class="action-btn bg-green" onclick="exportCSV()">Export to Excel</button>
      <button class="action-btn bg-red" onclick="clearHistory()">Clear History</button>
      <button class="action-btn bg-gray" onclick="closeModals()">Close</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_TOPICS = 'ips_topics_v6';
  const STORAGE_HISTORY = 'ips_history_v6';
  const STORAGE_STUDENTS = 'ips_students_v6';
  
  const defaultTopics = [
    "Impact of Social Media", "Climate Change", "Reading Books", "AI in Education",
    "My Role Model", "Overcoming Failure", "Value of Teamwork", "Traditional vs Modern Ed", 
    "Positive Thinking", "Learning English", "Sports in School", "A Day That Changed Me", 
    "Protecting Environment", "Future of Tech", "Mental Health Matters"
  ];
  
  const defaultStudents = [
    "Pakokku: Mg 1", "Pakokku: M2", "Pakokku: M3",
    "Yangon: Mg 4", "Yangon: M5"
  ];

  const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c', '#34495e', '#d35400', '#2980b9'];

  let masterPool = [];
  let currentWheelPool = [];
  let currentStudentTopics = [];
  let currentStudentName = "";
  let currentStudentTownship = "";
  let drawsRemaining = 0;
  
  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  let currentAngle = 0;
  let spinVelocity = 0;
  let isSpinning = false;

  window.onload = () => {
    if (!localStorage.getItem(STORAGE_TOPICS)) { localStorage.setItem(STORAGE_TOPICS, defaultTopics.join('\n')); }
    document.getElementById('topicList').value = localStorage.getItem(STORAGE_TOPICS);
    
    if (!localStorage.getItem(STORAGE_STUDENTS)) { localStorage.setItem(STORAGE_STUDENTS, defaultStudents.join('\n')); }
    document.getElementById('studentList').value = localStorage.getItem(STORAGE_STUDENTS);
    
    populateTownships();
    
    masterPool = getSavedArray(STORAGE_TOPICS);
    currentWheelPool = [...masterPool]; 
    drawWheel();
  };

  function getSavedArray(key) { 
    return (localStorage.getItem(key) || "").split('\n').map(t => t.trim()).filter(t => t !== ''); 
  }

  function getParsedStudents() {
    let lines = getSavedArray(STORAGE_STUDENTS);
    let parsed = [];
    lines.forEach(line => {
      if (line.includes(':')) {
        let parts = line.split(':');
        parsed.push({ township: parts[0].trim(), name: parts[1].trim(), raw: line });
      } else {
        parsed.push({ township: 'General', name: line, raw: line });
      }
    });
    return parsed;
  }

  function populateTownships() {
    const students = getParsedStudents();
    const townships = [...new Set(students.map(s => s.township))];
    const tsSelect = document.getElementById('townshipSelect');
    
    let currentVal = tsSelect.value;
    tsSelect.innerHTML = '<option value="">-- All Townships --</option>';
    
    townships.forEach(ts => {
      let opt = document.createElement('option');
      opt.value = ts; opt.innerText = ts;
      tsSelect.appendChild(opt);
    });
    
    tsSelect.value = currentVal; 
    populateStudentDropdown();
  }

  function populateStudentDropdown() {
    const selectedTs = document.getElementById('townshipSelect').value;
    const students = getParsedStudents();
    const select = document.getElementById('studentSelect');
    
    select.innerHTML = '<option value="">-- Select Student --</option>';
    
    let filtered = selectedTs ? students.filter(s => s.township === selectedTs) : students;
    
    filtered.forEach(s => {
      let opt = document.createElement('option');
      opt.value = s.raw; 
      opt.innerText = selectedTs ? s.name : `${s.name} (${s.township})`;
      opt.dataset.township = s.township;
      opt.dataset.name = s.name;
      select.appendChild(opt);
    });
  }

  function addStudentOnTheSpot() {
    let ts = prompt("Enter the Township (e.g., Pakokku, Yangon):");
    if (!ts || ts.trim() === "") return;
    
    let name = prompt("Enter the Student's Name:");
    if (!name || name.trim() === "") return;

    let newEntry = `${ts.trim()}: ${name.trim()}`;
    let students = getSavedArray(STORAGE_STUDENTS);
    students.push(newEntry);
    
    localStorage.setItem(STORAGE_STUDENTS, students.join('\n'));
    document.getElementById('studentList').value = students.join('\n');
    
    populateTownships();
    
    document.getElementById('townshipSelect').value = ts.trim();
    populateStudentDropdown();
    document.getElementById('studentSelect').value = newEntry;
  }

  function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (currentWheelPool.length === 0) return;

    const cx = canvas.width / 2; const cy = canvas.height / 2;
    const radius = Math.min(cx, cy) - 5; const arc = (Math.PI * 2) / currentWheelPool.length;

    for (let i = 0; i < currentWheelPool.length; i++) {
      const angle = currentAngle + i * arc;
      ctx.beginPath(); ctx.fillStyle = colors[i % colors.length];
      ctx.moveTo(cx, cy); ctx.arc(cx, cy, radius, angle, angle + arc); ctx.lineTo(cx, cy);
      ctx.fill(); ctx.stroke();

      ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle + arc / 2);
      ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 30px sans-serif";
      ctx.fillText("?", radius - 30, 10); ctx.restore();
    }
    ctx.beginPath(); ctx.fillStyle = "#0f2027"; ctx.arc(cx, cy, 35, 0, Math.PI * 2);
    ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.stroke();
  }

  function spinStep() {
    if (!isSpinning) return;
    currentAngle += spinVelocity;
    spinVelocity *= 0.94; 
    drawWheel();
    if (spinVelocity < 0.002) {
      isSpinning = false; spinVelocity = 0; onSpinStop();
    } else { requestAnimationFrame(spinStep); }
  }

  function startDrawSequence() {
    const studentDropdown = document.getElementById('studentSelect');
    if (studentDropdown.selectedIndex <= 0) {
      alert("Please select a student first!"); return;
    }
    
    const selectedOpt = studentDropdown.options[studentDropdown.selectedIndex];
    currentStudentName = selectedOpt.dataset.name;
    currentStudentTownship = selectedOpt.dataset.township;

    masterPool = getSavedArray(STORAGE_TOPICS);
    if (masterPool.length < 5) { alert(`Pool only has ${masterPool.length} topics. Need at least 5.`); return; }

    const nameDisplay = document.getElementById('prominentName');
    const tsDisplay = document.getElementById('prominentTownship');
    nameDisplay.innerText = currentStudentName;
    tsDisplay.innerText = currentStudentTownship;
    nameDisplay.classList.add('show-anim');
    tsDisplay.classList.add('show-anim');

    currentWheelPool = [...masterPool];
    currentStudentTopics = [];
    drawsRemaining = 5;
    
    document.querySelectorAll('.topic-card').forEach(e => e.remove());
    document.getElementById('drawBtn').disabled = true;
    document.getElementById('studentSelect').disabled = true;
    document.getElementById('townshipSelect').disabled = true;

    triggerNextSpin();
  }

  function triggerNextSpin() {
    if (drawsRemaining === 0) { finishStudentTurn(); return; }
    document.getElementById('drawBtn').innerText = `Spinning (${6 - drawsRemaining}/5)...`;
    spinVelocity = 0.5 + Math.random() * 0.2; 
    isSpinning = true;
    requestAnimationFrame(spinStep);
  }

  function onSpinStop() {
    const offset = currentAngle % (Math.PI * 2);
    const pointerAngle = (Math.PI * 2 - offset) % (Math.PI * 2);
    const arc = (Math.PI * 2) / currentWheelPool.length;
    const selectedIndex = Math.floor(pointerAngle / arc);

    const winningTopic = currentWheelPool[selectedIndex];
    currentStudentTopics.push(winningTopic);
    currentWheelPool.splice(selectedIndex, 1);
    
    createCardAroundWheel(winningTopic, 5 - drawsRemaining);
    drawsRemaining--;
    
    setTimeout(() => { drawWheel(); setTimeout(triggerNextSpin, 400); }, 50);
  }

  function createCardAroundWheel(text, positionIndex) {
    let card = document.createElement('div');
    card.className = `topic-card pos-${positionIndex}`;
    card.innerText = text;
    document.getElementById('arena').appendChild(card);
    setTimeout(() => card.classList.add('show'), 20);
  }

  function finishStudentTurn() {
    document.getElementById('drawBtn').disabled = false;
    document.getElementById('drawBtn').innerText = "Spin Wheel";
    document.getElementById('studentSelect').disabled = false;
    document.getElementById('townshipSelect').disabled = false;
    
    saveToHistory(currentStudentName, currentStudentTownship, currentStudentTopics);
    currentWheelPool = [...masterPool];
    drawWheel();
  }

  function saveToHistory(name, township, topics) {
    let history = JSON.parse(localStorage.getItem(STORAGE_HISTORY)) || [];
    let timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    history.push({ name: name, township: township, time: timeString, topics: topics });
    localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));
  }

  function openHistory() {
    const history = JSON.parse(localStorage.getItem(STORAGE_HISTORY)) || [];
    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';
    history.slice().reverse().forEach(entry => {
      let tr = document.createElement('tr');
      tr.innerHTML = `<td>${entry.time}</td><td>${entry.township}</td><td><b>${entry.name}</b></td>
                      <td>${entry.topics[0]}</td><td>${entry.topics[1]}</td>
                      <td>${entry.topics[2]}</td><td>${entry.topics[3]}</td>
                      <td>${entry.topics[4]}</td>`;
      tbody.appendChild(tr);
    });
    document.getElementById('historyModal').style.display = 'flex';
  }

  function exportCSV() {
    let history = JSON.parse(localStorage.getItem(STORAGE_HISTORY)) || [];
    if(history.length === 0) { alert("History is empty."); return; }
    let csvContent = "Time,Township,Student Name,Topic 1,Topic 2,Topic 3,Topic 4,Topic 5\n";
    history.forEach(e => {
      let row = `"${e.time}","${e.township}","${e.name}",` + e.topics.map(t => `"${t.replace(/"/g, '""')}"`).join(",");
      csvContent += row + "\n";
    });
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
    link.download = "IPS_Contest_History.csv"; document.body.appendChild(link); link.click(); document.body.removeChild(link);
  }

  function clearHistory() {
    if(confirm("Delete ALL student history? This cannot be undone.")) {
      localStorage.removeItem(STORAGE_HISTORY); openHistory(); 
    }
  }

  function globalWipe() {
    let pass = prompt("Enter Admin Password to initiate factory reset:");
    if (pass === "1123") {
      let confirmWord = prompt("WARNING: This deletes ALL topics, students, and history.\nType 'RESET' in all caps to confirm:");
      if (confirmWord === "RESET") {
        localStorage.removeItem(STORAGE_TOPICS);
        localStorage.removeItem(STORAGE_STUDENTS);
        localStorage.removeItem(STORAGE_HISTORY);
        alert("All data wiped. The app will now reload.");
        location.reload();
      } else {
        alert("Factory reset cancelled.");
      }
    } else if (pass !== null) {
      alert("Access Denied.");
    }
  }

  function requestAdmin() {
    if (prompt("Enter Admin Password:") === "1123") { document.getElementById('adminModal').style.display = 'flex'; }
    else { alert("Access Denied"); }
  }
  
  function autoSaveAdmin() { 
    localStorage.setItem(STORAGE_TOPICS, document.getElementById('topicList').value);
    localStorage.setItem(STORAGE_STUDENTS, document.getElementById('studentList').value);
    populateTownships();
  }
  
  function reloadApp() { autoSaveAdmin(); location.reload(); }
  
  function clearPool() {
    if (confirm("Delete all topics and students?")) { 
      document.getElementById('topicList').value = ''; 
      document.getElementById('studentList').value = ''; 
      autoSaveAdmin(); 
    }
  }
  
  function closeModals() { document.getElementById('adminModal').style.display = 'none'; document.getElementById('historyModal').style.display = 'none'; }
</script>
</body>
</html>
