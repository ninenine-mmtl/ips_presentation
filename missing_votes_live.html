<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPS Missing Votes Live Report</title>

<!-- BACK4APP (PARSE) SCRIPTS -->
<script type="text/javascript" src="https://npmcdn.com/parse/dist/parse.min.js"></script>

<style>
  /* Naval Blue & Yellow Theme (Inherited from Main App) */
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: #0A1930; 
    color: #ffffff; 
    margin: 0; 
    padding: 0; 
    min-height: 100vh;
  }
  
  .container { max-width: 900px; margin: 20px auto; padding: 15px; box-sizing: border-box; }
  
  header { 
    background: rgba(2, 12, 27, 0.95); padding: 15px 20px; display: flex; flex-direction: column; 
    gap: 15px; align-items: center; text-align: center; border-bottom: 3px solid #FFC107; 
  }
  
  h1 { margin: 0; font-size: 1.5rem; color: #FFC107; line-height: 1.2; }
  
  .card { 
    background: rgba(17, 34, 64, 0.95); padding: 20px; border-radius: 12px; margin-bottom: 20px; 
    border: 1px solid #FFC107; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(5px); 
  }
  h2, h3 { margin-top: 0; border-bottom: 1px solid #233554; padding-bottom: 10px; color: #FFC107; }

  ul { list-style-type: none; padding-left: 0; line-height: 1.8; font-size: 1.05rem; }
  li { border-bottom: 1px dashed #233554; padding: 5px 0; }
  li:last-child { border-bottom: none; }
  
  .completed-msg { color: #2ecc71; font-weight: bold; font-size: 1.1rem; padding: 10px 0; }

  .status-badge { 
    padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; 
    background: #FFC107; color: #020C1B; display: inline-block; margin-top: 10px;
  }

  /* Desktop Adjustments */
  @media(min-width: 768px) {
    header { flex-direction: row; justify-content: space-between; text-align: left; }
    h1 { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>IPS Missing Votes Live Report</h1>
    <div class="status-badge" id="syncStatus">● Syncing with live database...</div>
  </div>
</header>

<div class="container" id="reportContainer">
  <!-- Dynamic content will be injected here -->
</div>

<script>
  // ==========================================
  // INJECTED BACK4APP (PARSE) CONFIG
  // ==========================================
  Parse.initialize(
    "KQHogVKClAE7uofUaEr6IswMkNFXENXFktQSGbrR", // Application ID
    "2sWSdVYGDXcsy2fWmvSi1FPfE7HzAyvwQw49a8R1"  // JavaScript Key
  );
  Parse.serverURL = 'https://parseapi.back4app.com/';
  // ==========================================

  // Missing Vote Logic Rules Configuration
  const activeJudgeProfiles = [
    { match: "Daw Tin May Tun", restriction: "monywa" },
    { match: "Daw Kay Zin Hmway", restriction: "mohnyin" },
    { match: "Daw Hla Hla Win Htay", restriction: "myeik" },
    { match: "Daw Sandi Paing Soe Moe", restriction: "pakokku" },
    { match: "Tr. Lamai Sarah", restriction: "lashio" }
  ];

  const ignoredStudents = [
    "Ma Khaing Thazin Thin (G8)",
    "Hay Man Min Oo (G7)",
    "Mg Sai Hsaing Kay Wun (G4)"
  ];

  const excusedAbsences = [
    { judge: "Daw Kay Zin Hmway", student: "Ma Thwin Hay Man Oo (G7)" },
    { judge: "Daw Kay Zin Hmway", student: "Ma Kyawt Shin Thwe (G9)" }
  ];

  async function fetchDbAndCalculate() {
    const AppData = Parse.Object.extend("AppData");
    const query = new Parse.Query(AppData);
    query.descending("createdAt"); 
    query.limit(1);
    
    try {
      const results = await query.find();
      if (results.length > 0) {
        const data = results[0].get("payload");
        if (data) {
          calculateMissing(data);
          document.getElementById('syncStatus').innerText = "● Live Data Synced (" + new Date().toLocaleTimeString() + ")";
        }
      }
    } catch (error) {
      console.error("Error fetching data:", error);
      document.getElementById('syncStatus').innerText = "⚠️ Connection Error";
      document.getElementById('syncStatus').style.background = "#e74c3c";
      document.getElementById('syncStatus').style.color = "white";
    }
  }

  function calculateMissing(db) {
    const container = document.getElementById('reportContainer');
    
    // Safety checks for DB properties
    const students = db.students || [];
    const judges = db.judges || [];
    const scores = db.scores || {};

    // 1. Filter Judges (Only the active 5)
    const activeJudges = judges.filter(j => activeJudgeProfiles.some(p => j.name.includes(p.match)));
    
    // 2. Filter active students (exclude absentees)
    const activeStudents = students.filter(s => !ignoredStudents.includes(s.name.trim()));

    let newHtml = "";

    activeJudges.forEach(judge => {
      const profile = activeJudgeProfiles.find(p => judge.name.includes(p.match));
      let missingList = [];

      activeStudents.forEach(student => {
        // A. Township Restriction Check
        if (student.township.trim().toLowerCase() === profile.restriction) return;
        
        // B. Excused Absence Check
        const isExcused = excusedAbsences.some(ea => 
          judge.name.includes(ea.judge) && student.name.trim() === ea.student
        );
        if (isExcused) return;

        // C. Existing Score Check
        const hasScored = scores[student.id] && scores[student.id][judge.id];
        if (!hasScored) {
          missingList.push(student);
        }
      });

      // Render the judge's card
      newHtml += `<div class="card">
        <h3>To: Judge ${judge.name}</h3>`;
      
      if (missingList.length === 0) {
         newHtml += `<div class="completed-msg">✅ All required scores have been submitted.</div>`;
      } else {
         newHtml += `<ul>`;
         missingList.forEach(s => {
           newHtml += `<li>• ${s.name} - ${s.township}</li>`;
         });
         newHtml += `</ul>`;
      }
      newHtml += `</div>`;
    });

    // Update DOM only if data changed to prevent flashing
    if(container.innerHTML !== newHtml) {
        container.innerHTML = newHtml;
    }
  }

  // Fetch every 3 seconds to keep sync with main index file
  setInterval(fetchDbAndCalculate, 3000);
  fetchDbAndCalculate(); // Initial fetch
</script>

</body>
</html>
